name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  lint:
    uses: maragudk/workflows/.github/workflows/lint.yml@main

  test:
    uses: maragudk/workflows/.github/workflows/test.yml@main
    with:
      s3: true
      postgres: true
